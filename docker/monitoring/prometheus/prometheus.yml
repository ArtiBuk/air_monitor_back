global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - air-monitor-alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - air-monitor-prometheus:9090

  - job_name: django-web
    metrics_path: /metrics
    static_configs:
      - targets:
          - air-monitor-web:8000

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - air-monitor-postgres-exporter:9187

  - job_name: redis-exporter
    static_configs:
      - targets:
          - air-monitor-redis-exporter:9121

  - job_name: node-exporter
    static_configs:
      - targets:
          - air-monitor-node-exporter:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - air-monitor-cadvisor:8080

  - job_name: frontend-nginx
    static_configs:
      - targets:
          - air-monitor-frontend-exporter:9113

  - job_name: alertmanager
    static_configs:
      - targets:
          - air-monitor-alertmanager:9093
